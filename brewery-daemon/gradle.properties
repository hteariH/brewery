# Maven Central answers bursts of requests from CI runners with 429 Too Many Requests. Gradle retries
# that (and other transient network errors) with an exponential back-off; give it more room than the
# default 3 attempts from 1 s: 6 attempts, waiting 4, 8, 16, 32 and 64 s.
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=4000
