# The Gradle language server: lib/ of Microsoft's vscode-gradle VSIX at exactly the
# version the extension pins (src/gradle_ls.rs SUPPORTED_VERSION, downloaded from
# the same Marketplace URL). The extension has no setting for its path; Brewery
# copies <version>/ into the extension's work dir (gradle-ls/<version>/), where the
# extension looks first. The Marketplace lists no checksum: the SHA-256 is of two
# downloads on 2026-10-20 that matched, with the same lib/ the extension installed.
# The VSIX's NOTICE.txt covers the libraries in lib/.
[artifacts.gradle-ls]
