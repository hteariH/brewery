# The Java extension itself, exactly the archive Zed installs: the gallery
# endpoint extension_host uses for a pinned version
# (GET /extensions/<id>/<version>/download, a 307 to a signed object URL).
# The tar.gz unpacks to the installed directory (extension.toml,
# extension.wasm, grammars/, languages/, debug_adapter_schemas/). The GitHub
# release publishes no packaged extension, only the proxy and gradle bridge.
[artifacts.java-extension]
version = "6.8.28"
license = "Apache-2.0"
source = "https://github.com/zed-extensions/java/tree/v6.8.28"
license_file = "licenses/zed-extensions-java-LICENSE.txt"
dest = "extensions/java"
format = "tar.gz"

[artifacts.java-extension.any]
url = "https://api.zed.dev/extensions/java/6.8.28/download"
sha256 = "9a9862c3e6a54105f1ebdf43e4479fd2999e85b444fc4295efe340835b4f30a9"
