# Pinned dependencies of Brewery's offline bundle (M6c).
#
# Read by script/brewery/fetch_bundle_deps.py, which downloads each artifact,
# refuses any SHA-256 mismatch and lays out target/bundle/<os>-<arch>/.
#
# Per artifact:
#   version, license, source   what it is, its licence, where the pin came from
#   into    "bundle" (default): placed in the bundle at `dest`
#           "work": unpacked for build steps only (the JDK is jlinked into jre/)
#   dest    path inside the bundle; "{exe}" becomes ".exe" on Windows
#   format  "file" | "zip" | "tar.gz" (inferred from the URL when it ends in one)
#   root    directory inside the archive that becomes `dest`
#   member  single file inside the archive that becomes `dest`
#   [artifacts.<name>.<os>-<arch>] or [artifacts.<name>.any]: url + sha256
#   licence text for licenses/<name>/ (exactly one of):
#     license_file    file next to this one (upstream LICENSE at the pinned tag)
#     license_member  file inside the bundled jar
#     license_dir     directory inside the bundle (the jlinked JRE's legal/java.base)
#     license_members files inside the downloaded archive (licence and notices)
#
# Every SHA-256 below was computed from a download on 2026-10-14 and matches
# the checksum the publisher lists (Adoptium API, Eclipse .sha256 file, GitHub
# release asset digest; the Gradle LS VSIX has none, see its entry). Bumping a pin: change version/url, download the file,
# `sha256sum` it, compare with the publisher's checksum, update sha256.
#
# The versions follow what the Java extension 6.8.28 (the version Brewery
# auto-installs from the Zed gallery) downloads at runtime; see its src/
# debugger.rs, jdtls.rs, proxy.rs, gradle_bridge.rs and gradle_ls.rs at tag v6.8.28.

schema = 1
targets = ["windows-x64", "linux-x64", "linux-aarch64", "macos-aarch64", "macos-x64"]

# Eclipse Temurin JDK 21, latest GA. Build input only: jlink (Task 2) turns it
