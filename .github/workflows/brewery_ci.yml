name: Brewery CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_build:
        description: "Build the Windows release-fast brewery.exe"
        type: boolean
        default: true
      all_platforms:
        description: "Also build Linux and macOS release-fast"
        type: boolean
        default: false

# A newer push to a branch cancels the run it supersedes; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Caches are saved from main and tags only. Branches restore main's caches, so they
  # can't evict them from the repository's 10 GB cache budget.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Decides which jobs this run needs. Manual runs and tags always run everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      daemon: ${{ steps.plan.outputs.daemon }}
      windows_check: ${{ steps.plan.outputs.windows_check }}
      windows_build: ${{ steps.plan.outputs.windows_build }}
      other_builds: ${{ steps.plan.outputs.other_builds }}
      bundle: ${{ steps.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tooling/**'
              - 'extensions/**'
              - 'assets/**'
              - 'brewery-daemon/protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'script/linux'
              - '.github/workflows/brewery_ci.yml'
            daemon:
              - 'brewery-daemon/**'
              - '.github/workflows/brewery_ci.yml'
            bundle:
              - 'script/brewery/**'
              - 'brewery-daemon/**'
              - '.github/workflows/brewery_ci.yml'
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
          DAEMON_CHANGED: ${{ steps.filter.outputs.daemon }}
          BUNDLE_CHANGED: ${{ steps.filter.outputs.bundle }}
          INPUT_WINDOWS_BUILD: ${{ inputs.windows_build }}
          INPUT_ALL_PLATFORMS: ${{ inputs.all_platforms }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          everything=false
          if [[ "$EVENT" == workflow_dispatch || "$REF" == refs/tags/* ]]; then everything=true; fi
          rust=false; daemon=false
          if [[ $everything == true || "$RUST_CHANGED" == true ]]; then rust=true; fi
          if [[ $everything == true || "$DAEMON_CHANGED" == true ]]; then daemon=true; fi
          bundle=false
          if [[ $everything == true || "$BUNDLE_CHANGED" == true ]]; then bundle=true; fi
          # "[win]" in the pushed commit message asks for the Windows check and exe on a branch.
          win_tag=false
          if [[ "$EVENT" == push && "$HEAD_MESSAGE" == *"[win]"* ]]; then win_tag=true; fi
          windows_check=false
          if [[ $rust == true && ( "$REF" == refs/heads/main || $everything == true || $win_tag == true ) ]]; then
            windows_check=true
          fi
          windows_build=false
          if [[ "$REF" == refs/tags/* || $win_tag == true ]]; then windows_build=true; fi
          if [[ "$REF" == refs/heads/main && "$EVENT" == push && $rust == true ]]; then windows_build=true; fi
          if [[ "$EVENT" == workflow_dispatch && "$INPUT_WINDOWS_BUILD" == true ]]; then windows_build=true; fi
          other_builds=false
          if [[ "$REF" == refs/tags/* ]]; then other_builds=true; fi
          if [[ "$EVENT" == workflow_dispatch && "$INPUT_ALL_PLATFORMS" == true ]]; then other_builds=true; fi
          {
            echo "rust=$rust"
            echo "daemon=$daemon"
            echo "windows_check=$windows_check"
            echo "windows_build=$windows_build"
            echo "other_builds=$other_builds"
            echo "bundle=$bundle"
          } | tee -a "$GITHUB_OUTPUT"

  check-linux:
    name: Check and test (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: script/linux
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: brewery-check
          save-if: ${{ env.SAVE_CACHE }}
          cache-on-failure: true
      - name: Check
        run: cargo check -p zed --locked
      # extension_store_test::test_extension_store_with_test_extension builds a WASM test
      # extension and downloads toolchains; it times out on hosted runners. Run it locally.
      # util's Windows process-tree tests wait 5 s for PowerShell to start a grandchild, which
      # cold hosted runners often miss. Run them locally.
      - name: Test Brewery hook-ins
        run: cargo test --locked -p brewery_cloud -p brewery_core -p brewery_theme -p release_channel -p paths -p settings -p theme_settings -p client -p brewery_run_widget -p brewery_search_everywhere -p file_finder -p brewery_daemon_client -p brewery_spring_config -p brewery_build -p brewery_services -p brewery_db -p brewery_git -p brewery_bundle -p cli -p auto_update -p auto_update_ui -p extension_host -p util -p extension_suggest -- --skip test_extension_store_with_test_extension --skip test_kill_terminates_grandchildren --skip test_drop_terminates_grandchildren
      - name: Test workspace hook-ins
        run: cargo test --locked -p workspace --lib
      - name: Build the daemon jar
        working-directory: brewery-daemon
        run: ./gradlew shadowJar --no-daemon
      # The crate's end-to-end test skips itself without this variable, so it is what makes the test real.
      - name: Test daemon client against the built jar
        env:
          BREWERY_DAEMON_JAR: ${{ github.workspace }}/brewery-daemon/build/libs/brewery-daemon-all.jar
        run: cargo test --locked -p brewery_daemon_client

  check-windows:
    name: Check and test (windows-2025)
    needs: changes
    if: needs.changes.outputs.windows_check == 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install MSVC Spectre libraries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --norestart --nocache"
          # 3010 means "succeeded, reboot required", which a fresh runner can ignore.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\*\lib\spectre")) { throw "MSVC Spectre libraries not found under $vs" }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: brewery-check
          save-if: ${{ env.SAVE_CACHE }}
          cache-on-failure: true
      # The Windows release build compiles all of zed when it runs in the same workflow.
      - name: Check
        if: needs.changes.outputs.windows_build != 'true'
        run: cargo check -p zed --locked
      - name: Test Brewery hook-ins
        run: cargo test --locked -p brewery_cloud -p brewery_core -p brewery_theme -p release_channel -p paths -p settings -p theme_settings -p client -p brewery_run_widget -p brewery_search_everywhere -p file_finder -p brewery_daemon_client -p brewery_spring_config -p brewery_build -p brewery_services -p brewery_db -p brewery_git -p brewery_bundle -p cli -p auto_update -p auto_update_ui -p auto_update_helper -p extension_host -p util -p extension_suggest -- --skip test_extension_store_with_test_extension --skip test_kill_terminates_grandchildren --skip test_drop_terminates_grandchildren
      - name: Test workspace hook-ins
        run: cargo test --locked -p workspace --lib

  daemon:
    name: Daemon (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test and package
        working-directory: brewery-daemon
        shell: bash
        run: ./gradlew test shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brewery-daemon-${{ matrix.os }}
          path: brewery-daemon/build/libs/brewery-daemon-all.jar
          retention-days: 14

  # The offline bundle (script/brewery/fetch_bundle_deps.py): pinned, checksum-verified
  # downloads, a jlinked JRE (jlink only links for its own OS, hence the matrix), the
  # jdtls launcher and the daemon jar. Then a smoke test of the daemon and jdtls on the
  # bundled pieces; on Linux inside a network namespace, so nothing can be downloaded.
  bundle:
    name: Bundle (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: macos-aarch64
            unsupported: true
    continue-on-error: ${{ matrix.unsupported == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUNDLE: target/bundle/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The launcher and real-jlink tests use the setup-java JDK (it has jmods).
      - name: Test the bundle scripts
        env:
          BREWERY_TEST_JDK: ${{ env.JAVA_HOME }}
        run: python -m unittest discover -v script/brewery
      - name: Build the daemon jar
        working-directory: brewery-daemon
        run: ./gradlew -Pversion="$(cat ../crates/zed/BREWERY_VERSION)" shadowJar --no-daemon
      # Content-addressed by the pins; like the other caches, saved from main and tags only.
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/brewery-bundle
          key: brewery-bundle-${{ matrix.target }}-${{ hashFiles('script/brewery/bundle-deps.toml') }}
      - name: Fetch and lay out the bundle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python script/brewery/fetch_bundle_deps.py --os "${TARGET%-*}" --arch "${TARGET#*-}" \
            --daemon-jar brewery-daemon/build/libs/brewery-daemon-all.jar
      - name: Save the download cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/brewery-bundle
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Sizes
        run: |
          {
            echo "### Bundle ${{ matrix.target }}"
            echo '```'
            du -sh "$BUNDLE"/*
            du -sh "$BUNDLE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Hosted Ubuntu blocks unprivileged user namespaces (AppArmor), so fall back to a root
      # network namespace and drop back to the runner user inside it.
      - name: Offline smoke (daemon and jdtls, no network)
        if: runner.os == 'Linux'
        run: |
          if unshare -Un --map-current-user true 2>/dev/null; then
            echo "network namespace: unprivileged user namespace"
            unshare -Un --map-current-user python script/brewery/smoke_bundle.py "$BUNDLE" --require-offline
          else
            echo "network namespace: sudo unshare --net + setpriv"
            sudo unshare --net -- sh -c 'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --init-groups -- env "HOME=$3" "PATH=$4" python script/brewery/smoke_bundle.py "$5" --require-offline' \
              smoke "$(id -u)" "$(id -g)" "$HOME" "$PATH" "$BUNDLE"
          fi
      - name: Smoke (daemon and jdtls)
        if: runner.os != 'Linux'
        run: python script/brewery/smoke_bundle.py "$BUNDLE"
      # A tarball keeps the executable bits that upload-artifact's zip would drop.
      - name: Pack
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: tar -C target/bundle -czf "target/bundle-$TARGET.tar.gz" "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.os == 'Windows' && env.BUNDLE || format('target/bundle-{0}.tar.gz', matrix.target) }}
          retention-days: 14

  # Runs alongside the checks: the release-fast profile shares nothing with the test builds.
  build-windows:
    name: Build (windows-2025)
    needs: changes
    if: needs.changes.outputs.windows_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      # release-fast inherits full debuginfo, which is too heavy for hosted runners.
      CARGO_PROFILE_RELEASE_FAST_DEBUG: limited
    steps:
      - uses: actions/checkout@v4
      - name: Install MSVC Spectre libraries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --norestart --nocache"
          # 3010 means "succeeded, reboot required", which a fresh runner can ignore.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\*\lib\spectre")) { throw "MSVC Spectre libraries not found under $vs" }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: brewery-build
          save-if: ${{ env.SAVE_CACHE }}
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --profile release-fast -p zed
      - name: Assert exe metadata
        shell: pwsh
        run: |
          $exe = Get-Item target/release-fast/brewery.exe
          $info = $exe.VersionInfo
          $info | Format-List ProductName, FileDescription, CompanyName, LegalCopyright, FileVersion, ProductVersion
          $expected = (Get-Content crates/zed/BREWERY_VERSION -TotalCount 1).Trim()
          $channel = (Get-Content crates/zed/RELEASE_CHANNEL -TotalCount 1).Trim()
          $name = switch ($channel) { 'stable' { 'Brewery' } 'preview' { 'Brewery Preview' } 'nightly' { 'Brewery Nightly' } default { 'Brewery Dev' } }
          if ($info.ProductName -ne $name) { throw "ProductName is '$($info.ProductName)', expected '$name'" }
          if ($info.CompanyName -ne 'Brewery contributors') { throw "CompanyName is '$($info.CompanyName)'" }
          if ($info.FileVersion -ne $expected) { throw "FileVersion is '$($info.FileVersion)', expected '$expected'" }
      - uses: actions/upload-artifact@v4
        with:
          name: brewery-windows-2025
          path: target/release-fast/brewery.exe
          retention-days: 14

  # Linux and macOS release builds run on tags, or on a manual run with "all_platforms".
  build-other:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.other_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
            unsupported: true
    continue-on-error: ${{ matrix.unsupported == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CARGO_PROFILE_RELEASE_FAST_DEBUG: limited
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: script/linux
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: brewery-build
          save-if: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --profile release-fast -p zed
      # A separate invocation, as Zed's bundle scripts do, so the app's features don't unify into the CLI.
      - name: Build the CLI
        run: cargo build --locked --profile release-fast -p cli
      # The artifact holds the app as `brewery` and the CLI as `cli` (upload-artifact drops
      # the executable bits; packaging scripts copy and chmod them).
      - uses: actions/upload-artifact@v4
        with:
          name: brewery-${{ matrix.os }}
          path: |
            target/release-fast/brewery
            target/release-fast/cli
          retention-days: 14
