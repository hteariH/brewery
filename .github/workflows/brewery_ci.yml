name: Brewery CI

on:
  push:
    # Tags are built by brewery_release.yml, which calls this workflow for the stable channel.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_build:
        description: "Build the Windows release-fast brewery.exe"
        type: boolean
        default: true
      all_platforms:
        description: "Also build Linux and macOS release-fast"
        type: boolean
        default: false
  # brewery_release.yml: the build, bundle and package jobs for a release. "release" runs
  # everything (as a manual run does); "channel" is written into crates/zed/RELEASE_CHANNEL
  # before building and packaging.
  workflow_call:
    inputs:
      channel:
        description: "Release channel to build: dev or stable"
        type: string
        default: dev
      release:
        description: "Run every job, as for a release"
        type: boolean
        default: false

# A newer push to a branch cancels the run it supersedes; main, tags and manual runs always
# finish (each manual run is its own group, so a push doesn't cancel it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Caches are saved from main and tags only. Branches restore main's caches, so they
  # can't evict them from the repository's 10 GB cache budget.
  # Release calls (stable channel, other cache keys) never save: they would only fill the budget.
  SAVE_CACHE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && inputs.release != true }}
  # "dev" unless a caller asks for another channel (inputs are empty outside workflow_call).
  BREWERY_CHANNEL: ${{ inputs.channel || 'dev' }}
  # sccache, for the jobs that set RUSTC_WRAPPER: every rustc call is cached in the GitHub
  # Actions cache, workspace crates included (rust-cache only keeps dependencies). Each job has
  # its own SCCACHE_GHA_VERSION. Only main writes: entries written from a branch or tag are
  # scoped to that ref, nothing else can read them, and they evict main's caches from the
  # 10 GB budget (a branch's full fill did, in ci-speed's measurements).
  SCCACHE_GHA_ENABLED: "true"
  # A cache error (the API throttles) compiles locally instead of failing the build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # Misses and failed cache writes are logged at debug level (script/brewery/sccache-stats sums them up).
  SCCACHE_LOG: sccache::server=debug,sccache::compiler::compiler=debug
  SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && inputs.release != true && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  # Decides which jobs this run needs. Manual runs, tags and release calls always run everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      daemon: ${{ steps.plan.outputs.daemon }}
      windows_check: ${{ steps.plan.outputs.windows_check }}
      windows_build: ${{ steps.plan.outputs.windows_build }}
      other_builds: ${{ steps.plan.outputs.other_builds }}
      bundle: ${{ steps.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && inputs.release != true
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && inputs.release != true
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tooling/**'
              - 'extensions/**'
              - 'assets/**'
              - 'brewery-daemon/protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'script/linux'
              - '.github/workflows/brewery_ci.yml'
            daemon:
              - 'brewery-daemon/**'
              - '.github/workflows/brewery_ci.yml'
            bundle:
              - 'script/brewery/**'
              - 'brewery-daemon/**'
              - '.github/workflows/brewery_ci.yml'
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
          DAEMON_CHANGED: ${{ steps.filter.outputs.daemon }}
          BUNDLE_CHANGED: ${{ steps.filter.outputs.bundle }}
          INPUT_WINDOWS_BUILD: ${{ inputs.windows_build }}
          INPUT_ALL_PLATFORMS: ${{ inputs.all_platforms }}
          RELEASE: ${{ inputs.release }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$BREWERY_CHANNEL" != dev && "$BREWERY_CHANNEL" != stable ]]; then
            echo "::error::channel must be dev or stable, got '$BREWERY_CHANNEL'"
            exit 1
          fi
          everything=false
          if [[ "$EVENT" == workflow_dispatch || "$REF" == refs/tags/* || "$RELEASE" == true ]]; then everything=true; fi
          rust=false; daemon=false
          if [[ $everything == true || "$RUST_CHANGED" == true ]]; then rust=true; fi
          if [[ $everything == true || "$DAEMON_CHANGED" == true ]]; then daemon=true; fi
          bundle=false
          if [[ $everything == true || "$BUNDLE_CHANGED" == true ]]; then bundle=true; fi
          # "[win]" in the pushed commit message asks for the Windows check and exe on a branch.
          win_tag=false
          if [[ "$EVENT" == push && "$HEAD_MESSAGE" == *"[win]"* ]]; then win_tag=true; fi
          windows_check=false
          if [[ $rust == true && ( "$REF" == refs/heads/main || $everything == true || $win_tag == true ) ]]; then
            windows_check=true
          fi
          windows_build=false
          if [[ "$REF" == refs/tags/* || "$RELEASE" == true || $win_tag == true ]]; then windows_build=true; fi
          if [[ "$REF" == refs/heads/main && "$EVENT" == push && $rust == true ]]; then windows_build=true; fi
          if [[ "$EVENT" == workflow_dispatch && "$INPUT_WINDOWS_BUILD" == true ]]; then windows_build=true; fi
          other_builds=false
          if [[ "$REF" == refs/tags/* || "$RELEASE" == true ]]; then other_builds=true; fi
          if [[ "$EVENT" == workflow_dispatch && "$INPUT_ALL_PLATFORMS" == true ]]; then other_builds=true; fi
          {
            echo "rust=$rust"
            echo "daemon=$daemon"
            echo "windows_check=$windows_check"
            echo "windows_build=$windows_build"
            echo "other_builds=$other_builds"
            echo "bundle=$bundle"
          } | tee -a "$GITHUB_OUTPUT"

  check-linux:
    name: Check and test (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux dependencies
        run: script/linux
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      # Linux keeps rust-cache's compiled dependencies (warm in ~16 min): there is no room in
      # the 10 GB cache budget for sccache here as well.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: brewery-check
          save-if: ${{ env.SAVE_CACHE }}
          cache-on-failure: true
      - name: Check
        run: cargo check -p zed --locked
      # extension_store_test::test_extension_store_with_test_extension builds a WASM test
      # extension and downloads toolchains; it times out on hosted runners. Run it locally.
      # util's Windows process-tree tests wait 5 s for PowerShell to start a grandchild, which
      # cold hosted runners often miss. Run them locally.
      - name: Test Brewery hook-ins
        run: cargo test --locked -p brewery_cloud -p brewery_core -p brewery_theme -p release_channel -p paths -p settings -p theme_settings -p client -p brewery_run_widget -p brewery_search_everywhere -p file_finder -p brewery_daemon_client -p brewery_spring_config -p brewery_build -p brewery_services -p brewery_db -p brewery_git -p brewery_bundle -p cli -p auto_update -p auto_update_ui -p extension_host -p util -p extension_suggest -p diagnostics -- --skip test_extension_store_with_test_extension --skip test_kill_terminates_grandchildren --skip test_drop_terminates_grandchildren
      - name: Test workspace hook-ins
        run: cargo test --locked -p workspace --lib
      - name: Build the daemon jar
        working-directory: brewery-daemon
        run: ./gradlew shadowJar --no-daemon
      # The crate's end-to-end test skips itself without this variable, so it is what makes the test real.
      - name: Test daemon client against the built jar
        env:
          BREWERY_DAEMON_JAR: ${{ github.workspace }}/brewery-daemon/build/libs/brewery-daemon-all.jar
        run: cargo test --locked -p brewery_daemon_client

  check-windows:
    name: Check and test (windows-2025)
    needs: changes
    if: needs.changes.outputs.windows_check == 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_VERSION: check-windows
      # MSVC stamps every link with the time, so proc-macro DLLs differ from build to build, and
      # sccache hashes them as inputs of each crate that uses one; /Brepro makes them reproducible.
      # (This adds to the rustflags of .cargo/config.toml; RUSTFLAGS would replace them.)
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C link-arg=/Brepro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dev Drive
        shell: pwsh
        run: script/brewery/setup-dev-drive.ps1
      - name: Install MSVC Spectre libraries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --norestart --nocache"
          # 3010 means "succeeded, reboot required", which a fresh runner can ignore.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\*\lib\spectre")) { throw "MSVC Spectre libraries not found under $vs" }
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: sccache log
        shell: bash
        run: echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache.log" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: brewery-check
          cache-targets: false
          save-if: ${{ env.SAVE_CACHE }}
          cache-on-failure: true
      # The Windows release build compiles all of zed when it runs in the same workflow.
      - name: Check
        if: needs.changes.outputs.windows_build != 'true'
        run: cargo check -p zed --locked
      - name: Test Brewery hook-ins
        run: cargo test --locked -p brewery_cloud -p brewery_core -p brewery_theme -p release_channel -p paths -p settings -p theme_settings -p client -p brewery_run_widget -p brewery_search_everywhere -p file_finder -p brewery_daemon_client -p brewery_spring_config -p brewery_build -p brewery_services -p brewery_db -p brewery_git -p brewery_bundle -p cli -p auto_update -p auto_update_ui -p auto_update_helper -p extension_host -p util -p extension_suggest -p diagnostics -- --skip test_extension_store_with_test_extension --skip test_kill_terminates_grandchildren --skip test_drop_terminates_grandchildren
      - name: Test workspace hook-ins
        run: cargo test --locked -p workspace --lib
      - name: sccache stats
        if: always()
        shell: bash
        run: script/brewery/sccache-stats

  daemon:
    name: Daemon (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test and package
        working-directory: brewery-daemon
        shell: bash
        run: ./gradlew test shadowJar --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brewery-daemon-${{ matrix.os }}
          path: brewery-daemon/build/libs/brewery-daemon-all.jar
          retention-days: 14

  # The offline bundle (script/brewery/fetch_bundle_deps.py): pinned, checksum-verified
  # downloads, a jlinked JRE (jlink only links for its own OS, hence the matrix), the
  # jdtls launcher and the daemon jar. Then a smoke test of the daemon and jdtls on the
  # bundled pieces; on Linux inside a network namespace, so nothing can be downloaded.
  bundle:
    name: Bundle (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: macos-aarch64
            unsupported: true
    continue-on-error: ${{ matrix.unsupported == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUNDLE: target/bundle/${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The launcher and real-jlink tests use the setup-java JDK (it has jmods).
      - name: Test the bundle scripts
        env:
          BREWERY_TEST_JDK: ${{ env.JAVA_HOME }}
        run: python -m unittest discover -v script/brewery
      # resolveTestDependencies: this job shares the Daemon job's Gradle cache key and may save
      # it first, so it fills in the test dependencies too (brewery-daemon/build.gradle.kts).
      - name: Build the daemon jar
        working-directory: brewery-daemon
        run: ./gradlew -Pversion="$(cat ../crates/zed/BREWERY_VERSION)" shadowJar resolveTestDependencies --no-daemon
      # Content-addressed by the pins; like the other caches, saved from main and tags only.
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/brewery-bundle
          key: brewery-bundle-${{ matrix.target }}-${{ hashFiles('script/brewery/bundle-deps.toml') }}
      - name: Fetch and lay out the bundle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python script/brewery/fetch_bundle_deps.py --os "${TARGET%-*}" --arch "${TARGET#*-}" \
            --daemon-jar brewery-daemon/build/libs/brewery-daemon-all.jar
      - name: Save the download cache
        if: env.SAVE_CACHE == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/brewery-bundle
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Sizes
        run: |
          {
            echo "### Bundle ${{ matrix.target }}"
            echo '```'
            du -sh "$BUNDLE"/*
            du -sh "$BUNDLE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Hosted Ubuntu blocks unprivileged user namespaces (AppArmor), so fall back to a root
      # network namespace and drop back to the runner user inside it.
      - name: Offline smoke (daemon and jdtls, no network)
        if: runner.os == 'Linux'
        run: |
          if unshare -Un --map-current-user true 2>/dev/null; then
            echo "network namespace: unprivileged user namespace"
            unshare -Un --map-current-user python script/brewery/smoke_bundle.py "$BUNDLE" --require-offline
          else
            echo "network namespace: sudo unshare --net + setpriv"
            sudo unshare --net -- sh -c 'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --init-groups -- env "HOME=$3" "PATH=$4" python script/brewery/smoke_bundle.py "$5" --require-offline' \
              smoke "$(id -u)" "$(id -g)" "$HOME" "$PATH" "$BUNDLE"
          fi
      - name: Smoke (daemon and jdtls)
        if: runner.os != 'Linux'
        run: python script/brewery/smoke_bundle.py "$BUNDLE"
      # A tarball keeps the executable bits that upload-artifact's zip would drop.
      - name: Pack
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: tar -C target/bundle -czf "target/bundle-$TARGET.tar.gz" "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.os == 'Windows' && env.BUNDLE || format('target/bundle-{0}.tar.gz', matrix.target) }}
          retention-days: 14

  # Runs alongside the checks: the release-fast profile shares nothing with the test builds.
  build-windows:
    name: Build (windows-2025)
    needs: changes
    if: needs.changes.outputs.windows_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      # release-fast inherits full debuginfo, which is too heavy for hosted runners; the
      # stable channel ships without any.
      CARGO_PROFILE_RELEASE_FAST_DEBUG: ${{ inputs.channel == 'stable' && 'none' || 'limited' }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_VERSION: build-windows
      # MSVC stamps every link with the time, so proc-macro DLLs differ from build to build, and
      # sccache hashes them as inputs of each crate that uses one; /Brepro makes them reproducible.
      # (This adds to the rustflags of .cargo/config.toml; RUSTFLAGS would replace them.)
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C link-arg=/Brepro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dev Drive
        shell: pwsh
        run: script/brewery/setup-dev-drive.ps1
      # The channel is read from this file by the build (release_channel) and by the packaging scripts.
      - name: Select the release channel
        if: env.BREWERY_CHANNEL != 'dev'
        shell: bash
        run: |
          echo "$BREWERY_CHANNEL" > crates/zed/RELEASE_CHANNEL
          echo "RELEASE_CHANNEL=$BREWERY_CHANNEL" >> "$GITHUB_ENV"
      - name: Install MSVC Spectre libraries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --norestart --nocache"
          # 3010 means "succeeded, reboot required", which a fresh runner can ignore.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\*\lib\spectre")) { throw "MSVC Spectre libraries not found under $vs" }
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: sccache log
        shell: bash
        run: echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache.log" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: brewery-build
          cache-targets: false
          save-if: ${{ env.SAVE_CACHE }}
          cache-on-failure: true
      # Zed's licences of the Rust dependencies (cargo-about). They are embedded in the app
      # (Help > View Dependency Licenses), so they must exist before the build.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.8.2
      - name: Generate the Rust dependency licences
        shell: pwsh
        run: script/generate-licenses.ps1 assets/licenses.md
      # The installer also needs the CLI (bin\brewery.exe) and the update helper.
      - name: Build
        run: cargo build --locked --profile release-fast -p zed -p cli -p auto_update_helper
      - name: Keep the licences with the binaries
        shell: pwsh
        run: Copy-Item assets/licenses.md target/release-fast/licenses.md
      - name: Assert exe metadata
        shell: pwsh
        run: |
          $exe = Get-Item target/release-fast/brewery.exe
          $info = $exe.VersionInfo
          $info | Format-List ProductName, FileDescription, CompanyName, LegalCopyright, FileVersion, ProductVersion
          $expected = (Get-Content crates/zed/BREWERY_VERSION -TotalCount 1).Trim()
          $channel = (Get-Content crates/zed/RELEASE_CHANNEL -TotalCount 1).Trim()
          $name = switch ($channel) { 'stable' { 'Brewery' } 'preview' { 'Brewery Preview' } 'nightly' { 'Brewery Nightly' } default { 'Brewery Dev' } }
          if ($info.ProductName -ne $name) { throw "ProductName is '$($info.ProductName)', expected '$name'" }
          if ($info.CompanyName -ne 'Brewery contributors') { throw "CompanyName is '$($info.CompanyName)'" }
          if ($info.FileVersion -ne $expected) { throw "FileVersion is '$($info.FileVersion)', expected '$expected'" }
          # The binary FILEVERSION is numeric: x.y.z.0, without the pre-release (0.1.0-rc.1 -> 0.1.0.0).
          $numeric = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          $expectedNumeric = ($expected -replace '[-+].*$', '') + '.0'
          if ($numeric -ne $expectedNumeric) { throw "numeric file version is $numeric, expected $expectedNumeric" }
          if (-not $info.ProductVersion.StartsWith("$expected+")) { throw "ProductVersion is '$($info.ProductVersion)', expected '$expected+<channel>...'" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brewery-windows-2025
          path: |
            target/release-fast/brewery.exe
            target/release-fast/cli.exe
            target/release-fast/auto_update_helper.exe
            target/release-fast/licenses.md
          retention-days: 14
      - name: sccache stats
        if: always()
        shell: bash
        run: script/brewery/sccache-stats

  # The Windows installer (script/brewery/bundle-windows.ps1, Inno Setup) from the Windows build
  # and bundle, then a silent per-user install, update-mode run, helper swap and uninstall
  # (script/brewery/smoke-windows-installer.ps1) with the installer's default tasks.
  package-windows:
    name: Package (windows-x64)
    needs: [changes, build-windows, bundle]
    if: needs.changes.outputs.windows_build == 'true' && needs.changes.outputs.bundle == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The channel is read from this file by the build (release_channel) and by the packaging scripts.
      - name: Select the release channel
        if: env.BREWERY_CHANNEL != 'dev'
        shell: bash
        run: |
          echo "$BREWERY_CHANNEL" > crates/zed/RELEASE_CHANNEL
          echo "RELEASE_CHANNEL=$BREWERY_CHANNEL" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brewery-windows-2025
          path: target/windows-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-windows-x64
          path: target/bundle/windows-x64
      # windows-2025 ships Inno Setup 6 (not on PATH); bundle-windows.ps1 finds it there.
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found at $iscc" }
          (Get-Item $iscc).VersionInfo | Format-List FileVersion
      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          script/brewery/bundle-windows.ps1 -App target/windows-build/brewery.exe -Cli target/windows-build/cli.exe `
            -Helper target/windows-build/auto_update_helper.exe -Bundle target/bundle/windows-x64 `
            -RustLicenses target/windows-build/licenses.md -Out target/installer -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Smoke (install, update mode, helper swap, uninstall)
        shell: pwsh
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
        run: script/brewery/smoke-windows-installer.ps1 -Setup $env:SETUP
      - name: Size
        shell: pwsh
        env:
          SETUP: ${{ steps.installer.outputs.setup }}
        run: |
          $setup = Get-Item $env:SETUP
          $line = '{0}  {1:N1} MB' -f $setup.Name, ($setup.Length / 1MB)
          Write-Host $line
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @('### Windows installer', '', $line)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-windows-x64
          path: ${{ steps.installer.outputs.setup }}
          retention-days: 14

  # Linux and macOS release builds run on tags, or on a manual run with "all_platforms".
  build-other:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.other_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
            unsupported: true
    continue-on-error: ${{ matrix.unsupported == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CARGO_PROFILE_RELEASE_FAST_DEBUG: ${{ inputs.channel == 'stable' && 'none' || 'limited' }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The channel is read from this file by the build (release_channel) and by the packaging scripts.
      - name: Select the release channel
        if: env.BREWERY_CHANNEL != 'dev'
        shell: bash
        run: |
          echo "$BREWERY_CHANNEL" > crates/zed/RELEASE_CHANNEL
          echo "RELEASE_CHANNEL=$BREWERY_CHANNEL" >> "$GITHUB_ENV"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: script/linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: brewery-build
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.release != true }}
          cache-on-failure: true
      # Zed's licences of the Rust dependencies (cargo-about, the version script/generate-licenses
      # pins; prebuilt, checksum-checked by install-action). They are embedded in the app
      # (Help > View Dependency Licenses), so they must exist before the build.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.8.2
      - name: Generate the Rust dependency licences
        run: script/generate-licenses assets/licenses.md
      - name: Build
        run: cargo build --locked --profile release-fast -p zed
      # A separate invocation, as Zed's bundle scripts do, so the app's features don't unify into the CLI.
      - name: Build the CLI
        run: cargo build --locked --profile release-fast -p cli
      - name: Keep the licences with the binaries
        run: cp assets/licenses.md target/release-fast/licenses.md
      # The artifact holds the app as `brewery`, the CLI as `cli` and licenses.md
      # (upload-artifact drops the executable bits; packaging scripts copy and chmod them).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brewery-${{ matrix.os }}
          path: |
            target/release-fast/brewery
            target/release-fast/cli
            target/release-fast/licenses.md
          if-no-files-found: error
          retention-days: 14

  # The Linux tarball, deb and rpm from the Linux build and bundle (script/brewery/bundle-linux),
  # each package installed and removed in a clean container (script/brewery/smoke-linux-package).
  package-linux:
    name: Package (linux-x64)
    needs: [changes, build-other, bundle]
    if: needs.changes.outputs.other_builds == 'true' && needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The channel is read from this file by the build (release_channel) and by the packaging scripts.
      - name: Select the release channel
        if: env.BREWERY_CHANNEL != 'dev'
        shell: bash
        run: |
          echo "$BREWERY_CHANNEL" > crates/zed/RELEASE_CHANNEL
          echo "RELEASE_CHANNEL=$BREWERY_CHANNEL" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brewery-ubuntu-24.04
          path: target/linux-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-linux-x64
          path: target
      # bundle-linux copies the app's libraries from this host into lib/, so it needs the
      # ones the app links (ldd); it fails when one is missing.
      - name: Install packaging tools and the app's libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf gettext-base libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libasound2t64 libglib2.0-0t64 libstdc++6
          script/brewery/install-nfpm "$RUNNER_TEMP/nfpm"
      - name: Package
        run: |
          mkdir -p target/bundle
          tar -xzf target/bundle-linux-x64.tar.gz -C target/bundle
          script/brewery/bundle-linux --app target/linux-build/brewery --cli target/linux-build/cli \
            --bundle target/bundle/linux-x64 --licenses-md target/linux-build/licenses.md \
            --out target/package --deb --rpm --nfpm "$RUNNER_TEMP/nfpm/nfpm"
      - name: Contents
        run: |
          version=$(cat crates/zed/BREWERY_VERSION)
          dpkg-deb -I "target/package/brewery_${version}_amd64.deb"
          {
            echo "### Linux packages"
            echo '```'
            ls -l target/package
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke deb (ubuntu:24.04)
        run: |
          version=$(cat crates/zed/BREWERY_VERSION)
          docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:24.04 \
            script/brewery/smoke-linux-package "target/package/brewery_${version}_amd64.deb" --version "$version"
      - name: Smoke rpm (fedora:41)
        run: |
          version=$(cat crates/zed/BREWERY_VERSION)
          docker run --rm -v "$PWD:/src:ro" -w /src fedora:41 \
            script/brewery/smoke-linux-package "target/package/brewery-${version}-1.x86_64.rpm" --version "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux-x64
          path: |
            target/package/*.tar.gz
            target/package/*.deb
            target/package/*.rpm
          retention-days: 14

  # The unsigned macOS zip (script/brewery/bundle-mac) from the macOS build and bundle, then
  # script/brewery/smoke-mac-zip: layout, CFBundleIdentifier, signature seal, java, cli.
  # Unsupported like the rest of macOS: a failure doesn't fail the run.
  package-macos:
    name: Package (macos-aarch64)
    needs: [changes, build-other, bundle]
    if: needs.changes.outputs.other_builds == 'true' && needs.changes.outputs.bundle == 'true'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The channel is read from this file by the build (release_channel) and by the packaging scripts.
      - name: Select the release channel
        if: env.BREWERY_CHANNEL != 'dev'
        shell: bash
        run: |
          echo "$BREWERY_CHANNEL" > crates/zed/RELEASE_CHANNEL
          echo "RELEASE_CHANNEL=$BREWERY_CHANNEL" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test the Info.plist writer
        run: python -m unittest discover -v -s script/brewery -p 'test_mac_info_plist.py'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brewery-macos-15
          path: target/mac-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-macos-aarch64
          path: target
      - name: Package
        run: |
          mkdir -p target/bundle
          tar -xzf target/bundle-macos-aarch64.tar.gz -C target/bundle
          script/brewery/bundle-mac --app target/mac-build/brewery --cli target/mac-build/cli             --bundle target/bundle/macos-aarch64 --licenses-md target/mac-build/licenses.md --out target/package
      - name: Smoke
        run: script/brewery/smoke-mac-zip "target/package/brewery-$(cat crates/zed/BREWERY_VERSION)-macos-aarch64.zip"
      - name: Contents
        run: |
          {
            echo "### macOS zip (unsigned, unsupported)"
            echo '```'
            ls -l target/package
            unzip -l target/package/*.zip | head -n 40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macos-aarch64
          path: target/package/*.zip
          retention-days: 14

  # The winget manifests rendered with a placeholder checksum (the real installer isn't needed
  # to check their shape; the release workflow fills in the checksum of the real one) and
  # validated. Runs whenever the packaging scripts change.
  package-winget:
    name: Package (winget manifests)
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Render
        shell: pwsh
        run: |
          $version = (Get-Content crates/zed/BREWERY_VERSION -Raw).Trim()
          python script/brewery/render_manifests.py --version $version --only winget `
            --installer-sha256 ('0' * 64) --out target/manifests
      - name: winget
        shell: pwsh
        run: |
          $cmd = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $cmd) { throw "winget is not available on this runner" }
          winget --version | Out-Host
          winget validate --manifest target/manifests/winget | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
          # Control: the validator must reject a broken manifest, or the check above proves nothing.
          Copy-Item target/manifests/winget target/manifests/broken -Recurse
          (Get-Content target/manifests/broken/hteariH.Brewery.installer.yaml) -replace 'Scope: user', 'Scope: nobody' |
            Set-Content target/manifests/broken/hteariH.Brewery.installer.yaml
          winget validate --manifest target/manifests/broken | Out-Host
          if ($LASTEXITCODE -eq 0) { throw "winget validate accepted a manifest with an invalid Scope" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-winget-manifests
          path: target/manifests/winget
          retention-days: 14

  # `makepkg -si` as a non-root user in archlinux:base-devel against the Linux tarball that
  # package-linux built (file:// source), then the release PKGBUILD and its .SRCINFO.
  package-aur:
    name: Package (aur)
    needs: [changes, package-linux]
    if: needs.changes.outputs.other_builds == 'true' && needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-linux-x64
          path: target/package
      - name: Smoke (makepkg -si, archlinux:base-devel)
        run: |
          version=$(cat crates/zed/BREWERY_VERSION)
          mkdir -p target/aur
          chmod 777 target/aur
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/target/package:/pkg:ro" -v "$PWD/target/aur:/out" -w /src \
            archlinux:base-devel script/brewery/smoke-aur-package "/pkg/brewery-${version}-linux-x86_64.tar.gz" \
            --version "$version" --out /out
          cat target/aur/.SRCINFO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-aur
          include-hidden-files: true
          path: |
            target/aur/PKGBUILD
            target/aur/.SRCINFO
          retention-days: 14
