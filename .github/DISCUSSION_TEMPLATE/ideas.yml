body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea for Brewery! Please check the [open issues](https://github.com/hteariH/brewery/issues) and other ideas first.
  - type: textarea
    id: idea
    attributes:
      label: What would you like Brewery to do?
      description: Describe the feature or improvement. If IntelliJ IDEA or another IDE already does it, say how it works there.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: What problem does it solve, or what becomes easier?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, mockups, examples or ideas on how it could work.
