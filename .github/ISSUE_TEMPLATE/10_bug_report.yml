name: Report a bug
description: Something in Brewery doesn't work, crashes or freezes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search the existing issues](https://github.com/hteariH/brewery/issues?q=is%3Aissue) first; if the bug is already reported, add a 👍 and any new details there.

        Found a security problem? Don't open a public issue — see [SECURITY.md](https://github.com/hteariH/brewery/blob/main/SECURITY.md).
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: How to make the bug happen, starting from a fresh start of Brewery. A small sample project helps a lot.
      placeholder: |
        1. Open a Gradle project
        2. Click ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened and what you expected
      description: Screenshots or a short video are welcome.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Brewery version and system
      description: |
        In Brewery, open the command palette and run "zed: copy system specs into clipboard", then paste here. Also say how you installed Brewery (installer, deb, rpm, AUR, zip).
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Project setup (if relevant)
      description: Build tool and version (Gradle/Maven wrapper), JDK (`JAVA_HOME`), Spring Boot version, database and driver.
  - type: textarea
    attributes:
      label: Logs
      description: |
        For crashes, freezes or errors: the relevant part of the log. Open it with the "workspace: open log" command, or find it in `%LOCALAPPDATA%\Brewery\logs` (Windows) / `~/.local/share/brewery/logs` (Linux). For Java problems, also the jdtls log ("dev: open language server logs").
      render: shell
